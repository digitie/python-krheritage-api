[project]
name = "python-krheritage-api"
version = "0.1.0"
description = "Korea Heritage Administration open data API wrapper for TripMate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "digitie" }]
keywords = ["korea", "heritage", "open-data", "tripmate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "tenacity>=8.2",
  "lxml>=5.1",
  "platformdirs>=4.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
ai = ["datasets>=2.18", "huggingface-hub>=0.22"]
data = ["pandas>=2.2"]
dev = [
  "mypy>=1.9",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "respx>=0.20",
  "ruff>=0.4",
]
debug-ui = [
  "streamlit>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krheritage"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that call public remote Korea Heritage endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["krheritage"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true
